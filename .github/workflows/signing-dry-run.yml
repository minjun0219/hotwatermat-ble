# Temporary: runs the darwin signing steps of release.yml without a tag, so the PR that adds them
# can be checked before a release. Uses the real secrets when they exist, otherwise a throwaway
# certificate. Remove before merging.
name: Signing dry run

on:
  push:
    branches: [claude/project-thread-ox988y]

permissions:
  contents: read

jobs:
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Make a throwaway certificate when the secrets are missing
        env:
          MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
        run: |
          if [ -n "$MACOS_SIGNING_CERT_P12" ]; then
            echo "Using the MACOS_SIGNING_CERT_P12 secret"
            exit 0
          fi
          d="$RUNNER_TEMP/throwaway"
          mkdir -p "$d"
          printf '%s\n' '[req]' 'distinguished_name = dn' 'x509_extensions = ext' 'prompt = no' \
            '[dn]' 'CN = hotwatermat-ble dry run' \
            '[ext]' 'keyUsage = critical,digitalSignature' 'extendedKeyUsage = critical,codeSigning' > "$d/openssl.cnf"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config "$d/openssl.cnf" \
            -keyout "$d/key.pem" -out "$d/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$d/key.pem" -in "$d/cert.pem" -out "$d/cert.p12" \
            -passout pass:dry-run -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES
          echo "THROWAWAY_P12=$(base64 < "$d/cert.p12" | tr -d '\n')" >> "$GITHUB_ENV"
          echo "THROWAWAY_PASSWORD=dry-run" >> "$GITHUB_ENV"

      # Same as release.yml from here, except the env fallback and VERSION.
      - name: Import signing certificate
        env:
          MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 || env.THROWAWAY_P12 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD || env.THROWAWAY_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGNING_CERT_P12" ] || [ -z "$MACOS_SIGNING_CERT_PASSWORD" ]; then
            echo "::error::MACOS_SIGNING_CERT_P12 and MACOS_SIGNING_CERT_PASSWORD secrets are required to sign the darwin binaries"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          base64 --decode <<<"$MACOS_SIGNING_CERT_P12" > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -f pkcs12 -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          ids=$(security find-identity -p codesigning "$KEYCHAIN" | grep -Eo '^ *[0-9]+\) [0-9A-F]{40}' | awk '{print $2}' | sort -u)
          if [ "$(grep -c . <<<"$ids")" -ne 1 ]; then
            echo "::error::expected one code signing identity in MACOS_SIGNING_CERT_P12, found: ${ids:-none}"
            exit 1
          fi
          echo "Signing identity: $ids"
          echo "SIGNING_IDENTITY=$ids" >> "$GITHUB_ENV"

      - name: Build and archive darwin binaries
        run: |
          VERSION="dry-run-${GITHUB_SHA::7}"
          PLIST="$PWD/cmd/hotwatermat-ble/Info.plist"
          plutil -lint "$PLIST"
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw -o - "$PLIST")
          LEAF=$(tr 'A-F' 'a-f' <<<"$SIGNING_IDENTITY")
          for arch in amd64 arm64; do
            mkdir -p staging
            GOOS=darwin GOARCH=$arch CGO_ENABLED=1 go build \
              -ldflags="-s -w -X main.version=${VERSION} -linkmode external -extldflags '-sectcreate __TEXT __info_plist ${PLIST}'" \
              -o "staging/hotwatermat-ble" ./cmd/hotwatermat-ble/
            codesign --force --sign "$SIGNING_IDENTITY" --keychain "$SIGNING_KEYCHAIN" --identifier "$BUNDLE_ID" staging/hotwatermat-ble
            codesign --verify --strict staging/hotwatermat-ble
            sig=$(codesign -dvvv staging/hotwatermat-ble 2>&1)
            grep -q "^Identifier=${BUNDLE_ID}$" <<<"$sig"
            grep -q "^Info.plist entries=" <<<"$sig"
            req=$(codesign -d -r- staging/hotwatermat-ble 2>&1)
            grep -qF "identifier \"${BUNDLE_ID}\"" <<<"$req"
            grep -qE "certificate (leaf|root) = H\"${LEAF}\"" <<<"$req"
            echo "$sig"
            echo "$req"
            cp README.md LICENSE staging/
            mkdir -p dist
            tar -czf "dist/hotwatermat-ble_${VERSION}_darwin_${arch}.tar.gz" -C staging .
            rm -rf staging
          done

      - name: Delete signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-darwin
          path: dist/
          retention-days: 3
