version: 2

project_name: hotwatermat-ble

before:
  hooks:
    - cd go && go mod tidy

builds:
  - id: cli
    main: ./cmd/hotwatermat-ble/
    dir: go
    binary: hotwatermat-ble
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: mcp-server
    main: ./cmd/mcp-server/
    dir: go
    binary: hotwatermat-ble-mcp
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - PROTOCOL.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

release:
  prerelease: auto
  draft: false
