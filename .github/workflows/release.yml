name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and archive darwin binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          for arch in amd64 arm64; do
            mkdir -p staging
            GOOS=darwin GOARCH=$arch CGO_ENABLED=1 go build -ldflags="-s -w" \
              -o "staging/hotwatermat-ble" ./cmd/hotwatermat-ble/
            cp README.md LICENSE staging/
            mkdir -p dist
            tar -czf "dist/hotwatermat-ble_${VERSION}_darwin_${arch}.tar.gz" -C staging .
            rm -rf staging
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install BLE deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Build and archive linux amd64
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p staging
          CGO_ENABLED=1 go build -ldflags="-s -w" \
            -o "staging/hotwatermat-ble" ./cmd/hotwatermat-ble/
          cp README.md LICENSE staging/
          mkdir -p dist
          tar -czf "dist/hotwatermat-ble_${VERSION}_linux_amd64.tar.gz" -C staging .
          rm -rf staging

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  publish:
    needs: [release-darwin, release-linux]
    if: always() && needs.release-darwin.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
