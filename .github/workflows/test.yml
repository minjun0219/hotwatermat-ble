name: Test

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Vet and build every package, not just protocol, so a broken pkg/ble or CLI
      # cannot reach main. Same settings as the Linux release build.
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"

      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      - name: Test protocol
        run: go test -v -race ./pkg/protocol/...

  # Context7 reads this file to serve the docs to coding agents. Over the schema limits
  # (e.g. a 200-character description) it gets rejected or truncated, so validate it here
  # against the schema Context7 publishes.
  context7:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate context7.json
        run: |
          curl -sSfL --retry 3 https://context7.com/schema/context7.json -o "$RUNNER_TEMP/context7.schema.json"
          npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate -c ajv-formats \
            -s "$RUNNER_TEMP/context7.schema.json" -d context7.json
