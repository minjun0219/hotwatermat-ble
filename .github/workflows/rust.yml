name: Rust

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**", "claude/**"]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # btleplug(Linux/BlueZ)는 dbus 개발 헤더를 링크해야 함
      - name: Install BLE build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --all
