[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hotwatermat-ble"
version = "0.1.0"
description = "Python CLI to control BLE hot water mat (KDO_HotWaterMat / EQM555)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "bleak>=0.21.0",
    "click>=8.0",
]

[project.scripts]
hotwatermat-ble = "hotwatermat_ble.cli:cli"

[tool.setuptools.packages.find]
include = ["hotwatermat_ble*"]
