name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Build darwin binaries
        working-directory: go
        run: |
          mkdir -p ../dist
          go mod tidy
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=1 go build -ldflags="-s -w" \
              -o "../dist/hotwatermat-ble-darwin-${arch}" ./cmd/hotwatermat-ble/
            GOOS=darwin GOARCH=$arch CGO_ENABLED=1 go build -ldflags="-s -w" \
              -o "../dist/hotwatermat-ble-mcp-darwin-${arch}" ./cmd/mcp-server/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Install BLE deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Build linux amd64
        working-directory: go
        run: |
          mkdir -p ../dist
          go mod tidy
          CGO_ENABLED=1 go build -ldflags="-s -w" \
            -o "../dist/hotwatermat-ble-linux-amd64" ./cmd/hotwatermat-ble/
          CGO_ENABLED=1 go build -ldflags="-s -w" \
            -o "../dist/hotwatermat-ble-mcp-linux-amd64" ./cmd/mcp-server/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  publish:
    needs: [release-darwin, release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
