name: Test

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
  pull_request_target:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test protocol
        run: go test -v -race ./pkg/protocol/...

      - name: Vet protocol
        run: go vet ./pkg/protocol/...
